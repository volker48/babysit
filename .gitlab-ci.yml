image: rust:1.85.1-bookworm@sha256:bf7d87666c4da6eace19e06d21bc4859c6e2a5c97a21ac273b0e082112753cf0

stages:
  - verify
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

.default_rust_job:
  interruptible: true
  before_script:
    - rustup component add rustfmt clippy

fmt:
  extends: .default_rust_job
  stage: verify
  script:
    - cargo fmt --all --check

clippy:
  extends: .default_rust_job
  stage: verify
  script:
    - cargo clippy --locked --all-targets --all-features -- -D warnings

test:
  extends: .default_rust_job
  stage: verify
  script:
    - cargo test --locked --all

.default_gateway_job:
  image: node:24-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
  interruptible: true
  before_script:
    - corepack enable
    - pnpm config set minimumReleaseAge 1440
    - pnpm config set ignore-scripts true
    - pnpm install --frozen-lockfile --ignore-scripts

gateway_lint:
  extends: .default_gateway_job
  stage: verify
  script:
    - pnpm --filter @babysit/gateway lint

gateway_format:
  extends: .default_gateway_job
  stage: verify
  script:
    - pnpm --filter @babysit/gateway format:check

gateway_typecheck:
  extends: .default_gateway_job
  stage: verify
  script:
    - pnpm --filter @babysit/gateway typecheck

gateway_test:
  extends: .default_gateway_job
  stage: verify
  script:
    - pnpm --filter @babysit/gateway test

e2e:
  extends: .default_gateway_job
  stage: verify
  timeout: 15 minutes
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev
    - curl --fail --silent --show-error --location https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init --output /tmp/rustup-init
    - echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum --check
    - chmod +x /tmp/rustup-init
    - /tmp/rustup-init --yes --profile minimal --default-toolchain none --no-modify-path
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install
    - corepack enable
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    - pnpm --filter @babysit/e2e lint
    - pnpm --filter @babysit/e2e format:check
    - pnpm --filter @babysit/e2e typecheck
    - pnpm test:e2e
  artifacts:
    when: always
    paths:
      - e2e/.e2e/
    expire_in: 7 days

release:
  extends: .default_rust_job
  stage: build
  script:
    - cargo build --locked --release
  artifacts:
    name: "babysit-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - target/release/babysit
